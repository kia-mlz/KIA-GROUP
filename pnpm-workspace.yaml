packages:
  - "apps/*"
  - "packages/*"
  - "kia./*"
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@parcel/watcher': true
  bcrypt: true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
overrides:
  fast-uri: '>=4.1.4'
  postcss: 8.5.23
  sharp: 0.35.5
  brace-expansion: 5.0.9
  'brace-expansion@1': '>=1.1.18'
  js-yaml: '>=4.3.1'
  'js-yaml@3': '>=3.15.1'
  nanoid: '>=3.3.17'
  'nanoid@3': '>=3.3.17'
  deepmerge-ts: ^8.0.0
  mysql2: '>=3.22.0'
  multer: '>=2.4.0'
  nodemailer: '>=9.1.1'
  qs: '>=6.15.4'
  proxy-addr: '>=2.0.8'
  source-map-js: '>=1.2.2'
