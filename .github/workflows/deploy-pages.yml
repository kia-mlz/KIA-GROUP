name: Deploy GitHub Pages

# Builds the in-browser demo app (NEXT_PUBLIC_DEMO_MODE=true) and publishes it to
# GitHub Pages. Requires Settings → Pages → Source = "GitHub Actions", which this
# workflow enables itself on first run (actions/configure-pages enablement).
#
# CI-1 (supply chain): every third-party action is pinned to an immutable
# commit SHA (not a mutable tag) so a compromised action repo cannot push new
# code into this deploy pipeline. Permissions are scoped per job.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        # actions/checkout v4.3.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup pnpm
        # pnpm/action-setup v4.1.0
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 11.19.0

      - name: Setup Node
        # actions/setup-node v4.2.1
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # pnpm install --ignore-scripts skips the root postinstall that normally
      # generates the Prisma client (git-ignored, custom output at
      # packages/platform/src/generated). Generate it explicitly so the build
      # can resolve it (see apps/api/prisma.config.ts).
      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build static demo export
        # Owner + repo keep NEXT_PUBLIC_APP_URL / basePath in sync with the live
        # Pages host (https://<owner>.github.io/<repo>/), so a transfer or
        # rename cannot leave the mirror pointing at a 404 username.
        run: pnpm build:pages
        env:
          PAGES_OWNER: ${{ github.repository_owner }}
          PAGES_REPO_NAME: ${{ github.event.repository.name }}

      - name: Bypass Jekyll processing
        run: touch apps/group/out/.nojekyll

      - name: Configure Pages (extracts base_url/base_path; validates the site)
        # actions/configure-pages v6.0.0
        # NOTE: `enablement: true` is intentionally NOT used — the action
        # documents that enabling the site requires a token other than
        # GITHUB_TOKEN (PAT with repo scope / app with administration:write).
        # Enabling Pages is a one-time repo-admin step:
        #   Settings → Pages → Source = "GitHub Actions".
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Upload artifact
        # actions/upload-pages-artifact v5.0.0
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: apps/group/out

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        # actions/deploy-pages v5.0.0
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
