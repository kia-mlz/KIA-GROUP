name: Security

# Dedicated pipeline for supply-chain & static analysis.
# Runs on every push/PR to main plus a weekly sweep for new advisories.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Every Monday 03:00 UTC
    - cron: "0 3 * * 1"

# CI-1 (supply chain): every third-party action is pinned to an immutable
# commit SHA (not a mutable tag) so a compromised action repo cannot push new
# code into this pipeline. Job permissions are minimal and explicit.
permissions: {}

jobs:
  # ------------------------------------------------------- dependency audit --
  audit:
    name: Dependency audit (pnpm)
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # actions/checkout v4.3.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # pnpm/action-setup v4.1.0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 11.19.0
      # actions/setup-node v4.2.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      # Known-advisory gate — now BLOCKING: the dependency tree was triaged
      # clean (all high/moderate advisories resolved via workspace overrides)
      # so a new high+ advisory must fail CI until explicitly triaged.
      - name: Audit production dependencies (high+, blocking)
        run: pnpm audit --prod --audit-level=high

  # ------------------------------------------------------------ secret scan --
  secrets-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # actions/checkout v4.3.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0 # full history so gitleaks can scan commits
      - name: Scan for committed secrets
        # gitleaks-action v3.0.0
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ------------------------------------------------------------------- SAST --
  codeql:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      # actions/checkout v4.3.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # pnpm/action-setup v4.1.0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 11.19.0
      # actions/setup-node v4.2.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Initialize CodeQL
        # codeql-action v4.31.2
        uses: github/codeql-action/init@fddeee1a7ece751b577e409a89057319e3172939
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@fddeee1a7ece751b577e409a89057319e3172939
        with:
          category: "/language:javascript-typescript"