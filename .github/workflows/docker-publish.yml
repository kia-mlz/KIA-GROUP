name: Docker Publish

# Builds and publishes the hardened api/web images to GHCR on every push to
# main and on version tags (v*). Deploy servers then `docker pull` + restart —
# no image building on the production host (see docs/DEPLOY_RUNBOOK.md §8).
#
# Web build-args (NEXT_PUBLIC_APP_URL, NEXT_PUBLIC_API_URL, API_PROXY_TARGET)
# come from repository Actions variables when those variables are set. They are
# not secrets. If vars.NEXT_PUBLIC_APP_URL is empty this job still succeeds,
# but the web image bakes the Dockerfile default http://localhost:3000 and is
# NOT host-ready — set the variable before relying on the GHCR web image.
# docker-compose already passes the same args from .env.docker for local builds.
#
# Tags pushed per image:
#   main  /  sha-<commit>   (branch pushes)
#   1.2.3  /  sha-<commit>  (v* tags)
# Retention: older sha- images can be pruned via the GHCR UI or a scheduled
# cleanup action.

on:
  push:
    branches: [main]
    tags: ["v*"]

# CI-1 (supply chain): SHA-pinned actions, minimal per-job permissions.
permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    permissions:
      contents: read
      packages: write

    steps:
      # v4.3.1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Compute image tags
        id: tags
        run: |
          # GHCR requires lowercase repository names; GITHUB_REPOSITORY may not be.
          REPO="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${GITHUB_REF#refs/heads/}"
          fi
          {
            echo "version=${VERSION}"
            echo "api_image=${REPO}/api"
            echo "web_image=${REPO}/web"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        # docker/setup-buildx-action v3.10.0
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2

      - name: Log in to GHCR
        # docker/login-action v3.4.0
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push api image
        # docker/build-push-action v6.18.0
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          target: api
          push: true
          tags: |
            ${{ steps.tags.outputs.api_image }}:${{ steps.tags.outputs.version }}
            ${{ steps.tags.outputs.api_image }}:sha-${{ github.sha }}
          # Shared "deps" scope lets the web step reuse the deps/install layers
          # built by the api step (same builder stage); per-image scopes isolate
          # the app-build layers.
          cache-from: |
            type=gha,scope=api
            type=gha,scope=deps
          cache-to: type=gha,scope=api,mode=max

      # Only pass a build-arg when the matching repository variable is set.
      # An empty NEXT_PUBLIC_APP_URL would override the Dockerfile default and
      # still bake a useless origin; omitting it keeps the default and the job
      # green. That image is not host-ready until the variable is set.
      - name: Compose optional web build-args
        id: webargs
        env:
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          API_PROXY_TARGET: ${{ vars.API_PROXY_TARGET }}
        run: |
          set -euo pipefail
          args_file="$(mktemp)"
          if [[ -n "${NEXT_PUBLIC_APP_URL}" ]]; then
            printf 'NEXT_PUBLIC_APP_URL=%s\n' "${NEXT_PUBLIC_APP_URL}" >> "${args_file}"
          else
            echo "::notice title=Web image not host-ready::vars.NEXT_PUBLIC_APP_URL is empty. The published web image bakes the Dockerfile default (http://localhost:3000) and is NOT host-ready. Set the repository variable before using this image on a host. This job is not failed."
          fi
          if [[ -n "${NEXT_PUBLIC_API_URL}" ]]; then
            printf 'NEXT_PUBLIC_API_URL=%s\n' "${NEXT_PUBLIC_API_URL}" >> "${args_file}"
          fi
          if [[ -n "${API_PROXY_TARGET}" ]]; then
            printf 'API_PROXY_TARGET=%s\n' "${API_PROXY_TARGET}" >> "${args_file}"
          fi
          delimiter="WEB_BUILD_ARGS_$(openssl rand -hex 8)"
          {
            echo "args<<${delimiter}"
            cat "${args_file}"
            echo "${delimiter}"
          } >> "${GITHUB_OUTPUT}"
          rm -f "${args_file}"

      - name: Build and push web image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          target: web
          push: true
          build-args: ${{ steps.webargs.outputs.args }}
          tags: |
            ${{ steps.tags.outputs.web_image }}:${{ steps.tags.outputs.version }}
            ${{ steps.tags.outputs.web_image }}:sha-${{ github.sha }}
          cache-from: |
            type=gha,scope=web
            type=gha,scope=deps
          cache-to: |
            type=gha,scope=web,mode=max
            type=gha,scope=deps,mode=max
